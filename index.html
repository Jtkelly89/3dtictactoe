<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Tic-Tac-Toe</title>
<style>
  :root {
    --bg: #eef1f4;
    --board-surface: #ffffff;
    --grid-line: #23262b;
    --shadow-color: rgba(20, 24, 32, 0.25);
    --mark-x: #2c5cc5;
    --mark-o: #c23b22;
    --cell-hover: rgba(44, 92, 197, 0.07);
    --highlight-bg: rgba(217, 164, 6, 0.22);
    --highlight-border: #d9a406;
    --text-secondary: #3a3a3a;
    --btn-hover-bg: rgba(0, 0, 0, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --board-surface: #1f2126;
      --grid-line: #d8dadf;
      --shadow-color: rgba(0, 0, 0, 0.6);
      --mark-x: #7da2ff;
      --mark-o: #ff8a5c;
      --cell-hover: rgba(125, 162, 255, 0.1);
      --highlight-bg: rgba(232, 185, 35, 0.22);
      --highlight-border: #e8b923;
      --text-secondary: #cfd2d8;
      --btn-hover-bg: rgba(255, 255, 255, 0.08);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14161a;
    --board-surface: #1f2126;
    --grid-line: #d8dadf;
    --shadow-color: rgba(0, 0, 0, 0.6);
    --mark-x: #7da2ff;
    --mark-o: #ff8a5c;
    --cell-hover: rgba(125, 162, 255, 0.1);
    --highlight-bg: rgba(232, 185, 35, 0.22);
    --highlight-border: #e8b923;
    --text-secondary: #cfd2d8;
    --btn-hover-bg: rgba(255, 255, 255, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
  }

  .scene {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 9000px;
  }

  .stack {
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(58deg) rotateZ(-40deg);
  }

  .layer {
    position: absolute;
    top: 0;
    left: 0;
    transform-style: preserve-3d;
    width: var(--board-size);
    height: var(--board-size);
    margin-left: calc(var(--board-size) / -2);
    margin-top: calc(var(--board-size) / -2);
    display: grid;
    background: var(--board-surface);
    box-shadow: 0 0 0 2px var(--grid-line) inset, 0 18px 30px var(--shadow-color);
    border-radius: 2px;
  }

  .cell {
    position: relative;
    border: 1.5px solid var(--grid-line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
  }

  body:not(.exploring) .cell:hover {
    background: var(--cell-hover);
  }

  body.exploring .cell {
    cursor: default;
  }

  .mark {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
    font-weight: 700;
    font-size: calc(var(--board-size) / var(--n) / 2.1);
    user-select: none;
    pointer-events: none;
    line-height: 1;
  }

  .mark-X {
    color: var(--mark-x);
  }

  .mark-O {
    color: var(--mark-o);
  }

  .cell.win {
    background: var(--highlight-bg);
    box-shadow: 0 0 0 1.5px var(--highlight-border) inset;
    z-index: 2;
  }

  #lineOverlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 5;
  }

  #lineOverlay line {
    stroke: var(--highlight-border);
    stroke-width: 4;
    stroke-linecap: round;
    display: none;
  }

  body.exploring #lineOverlay line {
    display: inline;
  }

  .bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: stretch;
    background: var(--board-surface);
    border: 1.5px solid var(--grid-line);
    border-radius: 999px;
    overflow: hidden;
  }

  .size-bar {
    top: 4vh;
  }

  .explore-bar {
    bottom: 4vh;
  }

  .bar button {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: none;
    border: none;
    padding: 0.6em 1.2em;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .bar button + button {
    border-left: 1.5px solid var(--grid-line);
  }

  .bar button:hover {
    background: var(--btn-hover-bg);
  }

  .bar button:focus-visible {
    outline: 2px solid var(--mark-x);
    outline-offset: -2px;
  }

  .bar button.active {
    background: var(--grid-line);
    color: var(--board-surface);
  }

  .explore-bar button.primary.active {
    background: var(--highlight-border);
    color: #1a1a1a;
  }

  .explore-bar .counter {
    cursor: default;
  }

  .explore-bar .counter:hover {
    background: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .cell {
      transition: background 0.12s ease;
    }
  }
</style>
</head>
<body>
  <div class="bar size-bar" id="sizeBar"></div>

  <div class="scene">
    <div class="stack" id="stack"></div>
  </div>
  <svg id="lineOverlay"><line id="lineSeg" x1="0" y1="0" x2="0" y2="0"></line></svg>

  <div class="bar explore-bar" id="exploreBar"></div>

  <script>
    const BOARD_SIZES = [3, 4, 5];

    function layerStepVmin(n) {
      return n <= 4 ? 22 : 15;
    }

    function boardSizeVmin(n) {
      return n <= 4 ? 32 : 26;
    }

    let SIZE = 3;
    let state, LINES, exploring, currentLineIndex;

    const stackEl = document.getElementById("stack");
    const sizeBarEl = document.getElementById("sizeBar");
    const exploreBarEl = document.getElementById("exploreBar");
    const lineSegEl = document.getElementById("lineSeg");

    function generateLines(n) {
      const lines = [];
      const deltas = [-1, 0, 1];
      for (const dx of deltas) {
        for (const dy of deltas) {
          for (const dz of deltas) {
            if (dx === 0 && dy === 0 && dz === 0) continue;
            const firstNonZero = dx !== 0 ? dx : dy !== 0 ? dy : dz;
            if (firstNonZero < 0) continue;

            for (let x = 0; x < n; x++) {
              for (let y = 0; y < n; y++) {
                for (let z = 0; z < n; z++) {
                  const endX = x + dx * (n - 1);
                  const endY = y + dy * (n - 1);
                  const endZ = z + dz * (n - 1);
                  if (endX < 0 || endX >= n || endY < 0 || endY >= n || endZ < 0 || endZ >= n) {
                    continue;
                  }
                  const line = [];
                  for (let k = 0; k < n; k++) {
                    line.push([x + dx * k, y + dy * k, z + dz * k]);
                  }
                  lines.push(line);
                }
              }
            }
          }
        }
      }
      return lines;
    }

    function layerOffsets(n) {
      const step = layerStepVmin(n);
      const span = step * (n - 1);
      return Array.from({ length: n }, (_, i) => `${span / 2 - i * step}vmin`);
    }

    function buildBoard(n) {
      SIZE = n;
      state = Array.from({ length: n }, () =>
        Array.from({ length: n }, () => Array(n).fill(""))
      );
      LINES = generateLines(n);
      exploring = false;
      currentLineIndex = 0;

      document.documentElement.style.setProperty("--n", n);
      document.documentElement.style.setProperty("--board-size", `${boardSizeVmin(n)}vmin`);

      stackEl.innerHTML = "";
      const offsets = layerOffsets(n);
      offsets.forEach((offset, layerIndex) => {
        const layer = document.createElement("div");
        layer.className = "layer";
        layer.style.transform = `translateZ(${offset})`;
        layer.style.zIndex = String(offsets.length - layerIndex);
        layer.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
        layer.style.gridTemplateRows = `repeat(${n}, 1fr)`;

        for (let row = 0; row < n; row++) {
          for (let col = 0; col < n; col++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.layer = layerIndex;
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.addEventListener("click", onCellClick);
            layer.appendChild(cell);
          }
        }

        stackEl.appendChild(layer);
      });

      renderSizeBar();
      renderExploreBar();
      document.body.classList.remove("exploring");
    }

    function renderSizeBar() {
      sizeBarEl.innerHTML = "";
      BOARD_SIZES.forEach((n) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = `${n}×${n}×${n}`;
        btn.className = n === SIZE ? "active" : "";
        btn.addEventListener("click", () => {
          if (n !== SIZE) buildBoard(n);
        });
        sizeBarEl.appendChild(btn);
      });
    }

    function cellEl(l, r, c) {
      return document.querySelector(`.cell[data-layer="${l}"][data-row="${r}"][data-col="${c}"]`);
    }

    function renderExploreBar() {
      exploreBarEl.innerHTML = "";

      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "primary" + (exploring ? " active" : "");
      toggleBtn.textContent = exploring ? "Done" : "Show winning lines";
      toggleBtn.addEventListener("click", () => {
        exploring = !exploring;
        currentLineIndex = 0;
        document.body.classList.toggle("exploring", exploring);
        renderExploreBar();
        updateLineDisplay();
      });
      exploreBarEl.appendChild(toggleBtn);

      if (exploring) {
        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.textContent = "◀ Prev";
        prevBtn.addEventListener("click", () => stepLine(-1));

        const counter = document.createElement("button");
        counter.type = "button";
        counter.className = "counter";
        counter.disabled = true;

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.textContent = "Next ▶";
        nextBtn.addEventListener("click", () => stepLine(1));

        exploreBarEl.appendChild(prevBtn);
        exploreBarEl.appendChild(counter);
        exploreBarEl.appendChild(nextBtn);
      }
    }

    function stepLine(delta) {
      currentLineIndex = (currentLineIndex + delta + LINES.length) % LINES.length;
      updateLineDisplay();
    }

    function updateLineDisplay() {
      document.querySelectorAll(".cell.win").forEach((cell) => cell.classList.remove("win"));

      const counter = exploreBarEl.querySelector(".counter");
      if (!exploring) {
        lineSegEl.removeAttribute("x1");
        return;
      }

      const line = LINES[currentLineIndex];
      line.forEach(([l, r, c]) => cellEl(l, r, c).classList.add("win"));
      if (counter) counter.textContent = `Line ${currentLineIndex + 1} of ${LINES.length}`;

      positionLineOverlay(line);
    }

    function positionLineOverlay(line) {
      const first = cellEl(...line[0]).getBoundingClientRect();
      const last = cellEl(...line[line.length - 1]).getBoundingClientRect();
      lineSegEl.setAttribute("x1", first.left + first.width / 2);
      lineSegEl.setAttribute("y1", first.top + first.height / 2);
      lineSegEl.setAttribute("x2", last.left + last.width / 2);
      lineSegEl.setAttribute("y2", last.top + last.height / 2);
    }

    window.addEventListener("resize", () => {
      if (exploring) positionLineOverlay(LINES[currentLineIndex]);
    });

    function onCellClick(e) {
      if (exploring) return;
      const { layer, row, col } = e.currentTarget.dataset;
      const l = Number(layer), r = Number(row), c = Number(col);
      const current = state[l][r][c];
      const next = current === "" ? "X" : current === "X" ? "O" : "";
      state[l][r][c] = next;
      render(l, r, c);
    }

    function render(l, r, c) {
      const cell = cellEl(l, r, c);
      const value = state[l][r][c];
      cell.innerHTML = "";
      if (value) {
        const mark = document.createElement("span");
        mark.className = `mark mark-${value}`;
        mark.textContent = value;
        cell.appendChild(mark);
      }
    }

    buildBoard(SIZE);
  </script>
</body>
</html>
